version: 2

# ✅ SUCCESS CASE: Using static labels
# This configuration will work because Dependabot can match static labels

updates:
  - package-ecosystem: "npm"
    directory: "/"
    
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/New_York"
    
    # ✅ SOLUTION: Use static labels instead of dynamic expressions
    # This label will match any runner registered with "codebuild-dependabot"
    runs-on: 
      - self-hosted
      - codebuild-dependabot
    
    # Configuration options
    open-pull-requests-limit: 5
    
    # PR labels
    labels:
      - "dependencies"
      - "npm"
      - "automated"
    
    # Commit message preferences
    commit-message:
      prefix: "npm"
      prefix-development: "npm(dev)"
      include: "scope"
    
    # Reviewers (optional - add your GitHub username)
    # reviewers:
    #   - "your-github-username"
    
    # Assignees (optional)
    # assignees:
    #   - "your-github-username"
